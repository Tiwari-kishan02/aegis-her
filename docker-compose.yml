services:
  db:
    image: postgres:16-alpine
    container_name: aegis-db
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: aegis-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://aegis:aegis@db:5432/aegis
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
